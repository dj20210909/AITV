<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>配对 · 影視</title>
    <style>
        :root {
            --bg: #f7f7f9;
            --fg: #17181c;
            --sub: #6b7076;
            --line: #d9dbe0;
            --accent: #ff9f0a;
            --card: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131417;
                --fg: #f2f3f5;
                --sub: #9aa0a6;
                --line: #34363c;
                --card: #1c1d21;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 28px 24px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--line);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        p {
            margin: 0 0 20px;
            color: var(--sub);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1200;
            background: var(--accent);
            border: 0;
            border-radius: 12px;
        }

        button:disabled {
            opacity: .5;
        }

        .tip {
            margin-top: 16px;
            min-height: 20px;
            font-size: 13px;
            color: var(--sub);
        }

        .tip.error {
            color: #e5484d;
        }

        .tip.ok {
            color: #30a46c;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>设备配对</h1>
        <p>请输入电视上显示的 6 位配对码。配对码 30 分钟内有效。</p>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"
            autofocus>
        <button id="submit">配对</button>
        <div id="tip" class="tip"></div>
    </div>
    <script>
        var input = document.getElementById('code');
        var button = document.getElementById('submit');
        var tip = document.getElementById('tip');

        function show(text, type) {
            tip.textContent = text;
            tip.className = 'tip' + (type ? ' ' + type : '');
        }

        function submit() {
            var code = input.value.replace(/\D/g, '');
            if (code.length !== 6) {
                show('配对码应为 6 位数字', 'error');
                return;
            }
            button.disabled = true;
            show('正在配对…');
            fetch('/pair?code=' + encodeURIComponent(code), { method: 'POST', credentials: 'same-origin' })
                .then(function (res) { return res.json().catch(function () { return {}; }); })
                .then(function (json) {
                    if (json && json.token) {
                        show('配对成功，正在进入…', 'ok');
                        setTimeout(function () { location.reload(); }, 400);
                    } else {
                        show(json && json.error === 'too many attempts' ? '尝试次数过多，请稍后再试' : '配对码不正确', 'error');
                    }
                })
                .catch(function () { show('网络异常，请检查与电视的连接', 'error'); })
                .then(function () { button.disabled = false; });
        }

        button.addEventListener('click', submit);
        input.addEventListener('input', function () {
            if (input.value.length === 6) submit();
        });
        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') submit();
        });
    </script>
</body>

</html>
